services:
  backend:
    build:
      context: ..
      dockerfile: viewer/backend/Dockerfile
    env_file:
      - ./backend/.prod.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DUCKDB_CACHE_DIR: /app/.duckdb
    volumes:
      - backend_duckdb:/app/.duckdb
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_duckdb: {}
  redis_data: {}
