[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-lake-viewer"
version = "0.1.0"
description = "Web viewer for the data lake pipeline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "python-multipart",
  "duckdb>=0.10.0",
  "shared-data-lake-pipeline",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "httpx>=0.26.0",
]

[tool.uv.sources]
shared-data-lake-pipeline = { path = ".." }

[tool.hatch.build.targets.wheel]
packages = ["backend"]
