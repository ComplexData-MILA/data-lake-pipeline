[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-data-lake-pipeline"
version = "0.1.0"
description = "S3-based data lake and batch annotation pipeline for heterogeneous social data sources."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiobotocore>=2.0.0",
  "aiohttp>=3.0.0",
  "boto3>=1.34.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "pybloom-live>=4.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0",
  "smart-open[s3]>=7.0.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
